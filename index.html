<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>img-helper</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --danger: #f87171;
      --success: #4ade80;
      --badge-bg: #0ea5e9;
      --badge-text: #0f172a;
      --input-bg: #0f172a;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse at top, rgba(56, 189, 248, 0.08), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(99, 102, 241, 0.06), transparent 40%);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group:last-of-type {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="password"],
    input[type="url"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    input::placeholder {
      color: #64748b;
    }

    .preview-wrap {
      margin-top: 1rem;
      display: none;
      text-align: center;
    }

    .preview-wrap.visible {
      display: block;
    }

    .preview-wrap img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      object-fit: contain;
      background: #020617;
    }

    .preview-error {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    .preview-error.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.5em;
    }

    #status.loading {
      color: var(--accent);
    }

    #status.error {
      color: var(--danger);
    }

    #status.success {
      color: var(--success);
    }

    #results {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }

    .result-card:hover {
      border-color: var(--accent);
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .result-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
      word-break: break-word;
    }

    .badge {
      flex-shrink: 0;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .result-link {
      color: var(--accent);
      font-size: 0.875rem;
      text-decoration: none;
      word-break: break-all;
    }

    .result-link:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }

    .result-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: #475569;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.25rem 1rem 2rem;
      }

      .card {
        padding: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>img-helper</h1>
      <p>以圖搜圖 · 私人使用</p>
    </header>

    <main class="card">
      <form id="search-form" autocomplete="off">
        <div class="form-group">
          <label for="passcode">Passcode</label>
          <input
            type="password"
            id="passcode"
            name="passcode"
            placeholder="輸入通行密碼"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-group">
          <label for="image-url">Image URL</label>
          <input
            type="url"
            id="image-url"
            name="image-url"
            placeholder="https://example.com/image.jpg"
            required
          />
          <div class="preview-wrap" id="preview-wrap">
            <img id="preview-img" alt="圖片預覽" />
          </div>
          <p class="preview-error" id="preview-error">無法載入預覽，請確認網址是否為有效圖片。</p>
        </div>

        <button type="submit" id="submit-btn">開始比對分析</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
      <div id="results"></div>
    </main>

    <footer>img-helper · 僅供私人使用</footer>
  </div>

  <script>
    const WORKER_URL = 'https://img-helper.brianlin2021.workers.dev';
    const PASSCODE_KEY = 'img-helper-passcode';
    const SOCIAL_HOSTS = [
      'instagram.com',
      'facebook.com',
      'tiktok.com',
      'twitter.com',
      'x.com',
      'threads.net',
      'linkedin.com',
    ];

    const passcodeInput = document.getElementById('passcode');
    const imageUrlInput = document.getElementById('image-url');
    const form = document.getElementById('search-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const previewError = document.getElementById('preview-error');

    // Restore passcode from localStorage
    const savedPasscode = localStorage.getItem(PASSCODE_KEY);
    if (savedPasscode) {
      passcodeInput.value = savedPasscode;
    }

    passcodeInput.addEventListener('input', () => {
      localStorage.setItem(PASSCODE_KEY, passcodeInput.value);
    });

    function isValidImageUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function updatePreview() {
      const url = imageUrlInput.value.trim();
      previewError.classList.remove('visible');

      if (!url || !isValidImageUrl(url)) {
        previewWrap.classList.remove('visible');
        previewImg.removeAttribute('src');
        return;
      }

      previewImg.onload = () => {
        previewWrap.classList.add('visible');
        previewError.classList.remove('visible');
      };

      previewImg.onerror = () => {
        previewWrap.classList.remove('visible');
        previewError.classList.add('visible');
      };

      previewImg.src = url;
    }

    let previewTimer;
    imageUrlInput.addEventListener('input', () => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updatePreview, 300);
    });

    function isSocialPlatform(link) {
      if (!link) return false;
      try {
        const host = new URL(link).hostname.toLowerCase();
        return SOCIAL_HOSTS.some(
          (domain) => host === domain || host.endsWith('.' + domain)
        );
      } catch {
        return SOCIAL_HOSTS.some((domain) =>
          String(link).toLowerCase().includes(domain)
        );
      }
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type || '';
    }

    function renderResults(matches) {
      resultsEl.innerHTML = '';

      if (!Array.isArray(matches) || matches.length === 0) {
        resultsEl.innerHTML =
          '<p class="empty-state">找不到相符的視覺結果。</p>';
        return;
      }

      const fragment = document.createDocumentFragment();

      matches.forEach((match) => {
        const title =
          match.title || match.source || match.link || '未命名來源';
        const link = match.link || match.source_url || match.url || '';
        const source = match.source || '';

        const card = document.createElement('article');
        card.className = 'result-card';

        const header = document.createElement('div');
        header.className = 'result-header';

        const titleEl = document.createElement('div');
        titleEl.className = 'result-title';
        titleEl.textContent = title;
        header.appendChild(titleEl);

        if (isSocialPlatform(link) || isSocialPlatform(source)) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Social Platform';
          header.appendChild(badge);
        }

        card.appendChild(header);

        if (link) {
          const a = document.createElement('a');
          a.className = 'result-link';
          a.href = link;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = link;
          card.appendChild(a);
        }

        if (source && source !== title) {
          const meta = document.createElement('div');
          meta.className = 'result-meta';
          meta.textContent = source;
          card.appendChild(meta);
        }

        fragment.appendChild(card);
      });

      resultsEl.appendChild(fragment);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const passcode = passcodeInput.value.trim();
      const imageUrl = imageUrlInput.value.trim();

      if (!passcode) {
        setStatus('❌ 請輸入通行密碼', 'error');
        return;
      }

      if (!isValidImageUrl(imageUrl)) {
        setStatus('❌ 請輸入有效的圖片網址', 'error');
        return;
      }

      localStorage.setItem(PASSCODE_KEY, passcode);
      resultsEl.innerHTML = '';
      setStatus('🔍 分析搜尋中，請稍候...', 'loading');
      submitBtn.disabled = true;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Passcode': passcode,
          },
          body: JSON.stringify({ image_url: imageUrl }),
        });

        if (response.status === 401) {
          setStatus('❌ 密碼錯誤，拒絕存取', 'error');
          return;
        }

        if (!response.ok) {
          setStatus(
            `❌ 請求失敗（HTTP ${response.status}），請稍後再試`,
            'error'
          );
          return;
        }

        const data = await response.json();
        const matches = data.visual_matches || data.matches || [];

        setStatus(`✅ 找到 ${matches.length} 筆結果`, 'success');
        renderResults(matches);
      } catch (err) {
        console.error(err);
        setStatus(
          '❌ 連線失敗，請檢查網路或 Worker 服務是否正常',
          'error'
        );
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
