<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>img-helper</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --danger: #f87171;
      --success: #4ade80;
      --badge-bg: #0ea5e9;
      --badge-text: #0f172a;
      --input-bg: #0f172a;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse at top, rgba(56, 189, 248, 0.08), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(99, 102, 241, 0.06), transparent 40%);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group:last-of-type {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="password"],
    input[type="url"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    input::placeholder {
      color: #64748b;
    }

    .source-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      padding: 0.3rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    .source-tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .source-tab.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .source-panel {
      display: none;
    }

    .source-panel.active {
      display: block;
    }

    .dropzone {
      position: relative;
      border: 1.5px dashed var(--card-border);
      border-radius: 10px;
      background: var(--input-bg);
      padding: 1.4rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.06);
    }

    .dropzone-title {
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dropzone-hint {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .dropzone-file {
      margin-top: 0.55rem;
      color: var(--accent);
      font-size: 0.85rem;
      word-break: break-all;
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .preview-wrap {
      margin-top: 1rem;
      display: none;
      text-align: center;
    }

    .preview-wrap.visible {
      display: block;
    }

    .preview-wrap img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      object-fit: contain;
      background: #020617;
    }

    .preview-error {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    .preview-error.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.5em;
    }

    #status.loading {
      color: var(--accent);
    }

    #status.error {
      color: var(--danger);
    }

    #status.success {
      color: var(--success);
    }

    #results {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 0.9rem;
      transition: border-color 0.2s;
    }

    .result-card:hover {
      border-color: var(--accent);
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .result-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
      word-break: break-word;
    }

    .badge {
      flex-shrink: 0;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge-exact {
      background: #4ade80;
      color: #052e16;
    }

    .badge-visual {
      background: #64748b;
      color: #f8fafc;
    }

    .badge-social {
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .section-title {
      margin: 0.4rem 0 0.2rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #020617;
      flex-shrink: 0;
    }

    .result-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .result-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: flex-end;
    }

    .result-link {
      color: var(--accent);
      font-size: 0.875rem;
      text-decoration: none;
      word-break: break-all;
    }

    .result-link:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }

    .result-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: #475569;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.25rem 1rem 2rem;
      }

      .card {
        padding: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>img-helper</h1>
      <p>以圖搜圖 · 私人使用</p>
    </header>

    <main class="card">
      <form id="search-form" autocomplete="off">
        <div class="form-group">
          <label for="passcode">Passcode</label>
          <input
            type="password"
            id="passcode"
            name="passcode"
            placeholder="輸入通行密碼"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-group">
          <label>Image Source</label>
          <div class="source-tabs" role="tablist" aria-label="圖片來源">
            <button type="button" class="source-tab active" data-mode="url" role="tab" aria-selected="true">
              網址
            </button>
            <button type="button" class="source-tab" data-mode="upload" role="tab" aria-selected="false">
              上傳
            </button>
          </div>

          <div class="source-panel active" id="panel-url" data-panel="url">
            <input
              type="url"
              id="image-url"
              name="image-url"
              placeholder="https://example.com/image.jpg"
            />
          </div>

          <div class="source-panel" id="panel-upload" data-panel="upload">
            <div class="dropzone" id="dropzone">
              <input
                type="file"
                id="image-file"
                name="image-file"
                accept="image/*"
              />
              <div class="dropzone-title">點擊或拖曳圖片到這裡</div>
              <div class="dropzone-hint">支援 JPG、PNG、WEBP（上限 5 MB；瀏覽器直連 ImgBB，5 分鐘後自動刪除）</div>
              <div class="dropzone-file" id="file-name"></div>
            </div>
          </div>

          <div class="preview-wrap" id="preview-wrap">
            <img id="preview-img" alt="圖片預覽" />
          </div>
          <p class="preview-error" id="preview-error">無法載入預覽，請確認網址或檔案是否為有效圖片。</p>
        </div>

        <button type="submit" id="submit-btn">開始比對分析</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
      <div id="results"></div>
    </main>

    <footer>img-helper · 僅供私人使用</footer>
  </div>

  <script>
    const WORKER_URL = 'https://img-helper.brianlin2021.workers.dev';
    // ImgBB 上傳經 Worker 代轉（API Key 放在 Worker）；自動刪除 5 分鐘
    const IMGBB_EXPIRATION_SEC = 300;
    const PASSCODE_KEY = 'img-helper-passcode';
    const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;
    const SOCIAL_HOSTS = [
      'instagram.com',
      'facebook.com',
      'tiktok.com',
      'twitter.com',
      'x.com',
      'threads.net',
      'linkedin.com',
    ];

    const passcodeInput = document.getElementById('passcode');
    const imageUrlInput = document.getElementById('image-url');
    const imageFileInput = document.getElementById('image-file');
    const dropzone = document.getElementById('dropzone');
    const fileNameEl = document.getElementById('file-name');
    const form = document.getElementById('search-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const previewError = document.getElementById('preview-error');
    const sourceTabs = document.querySelectorAll('.source-tab');
    const sourcePanels = document.querySelectorAll('.source-panel');

    let sourceMode = 'url';
    let selectedFile = null;
    let objectUrl = null;

    const savedPasscode = localStorage.getItem(PASSCODE_KEY);
    if (savedPasscode) {
      passcodeInput.value = savedPasscode;
    }

    passcodeInput.addEventListener('input', () => {
      localStorage.setItem(PASSCODE_KEY, passcodeInput.value);
    });

    function clearObjectUrl() {
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
    }

    function hidePreview() {
      previewWrap.classList.remove('visible');
      previewError.classList.remove('visible');
      previewImg.removeAttribute('src');
      clearObjectUrl();
    }

    function showPreviewFromSrc(src, isObjectUrl) {
      previewError.classList.remove('visible');

      previewImg.onload = () => {
        previewWrap.classList.add('visible');
        previewError.classList.remove('visible');
      };

      previewImg.onerror = () => {
        previewWrap.classList.remove('visible');
        previewError.classList.add('visible');
      };

      if (!isObjectUrl) {
        clearObjectUrl();
      }

      previewImg.src = src;
    }

    function setSourceMode(mode) {
      sourceMode = mode;

      sourceTabs.forEach((tab) => {
        const active = tab.dataset.mode === mode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      sourcePanels.forEach((panel) => {
        panel.classList.toggle('active', panel.dataset.panel === mode);
      });

      hidePreview();

      if (mode === 'url') {
        selectedFile = null;
        imageFileInput.value = '';
        fileNameEl.textContent = '';
        updateUrlPreview();
      } else if (selectedFile) {
        previewSelectedFile(selectedFile);
      }
    }

    sourceTabs.forEach((tab) => {
      tab.addEventListener('click', () => setSourceMode(tab.dataset.mode));
    });

    function isValidImageUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function updateUrlPreview() {
      const url = imageUrlInput.value.trim();

      if (!url || !isValidImageUrl(url)) {
        hidePreview();
        return;
      }

      showPreviewFromSrc(url, false);
    }

    let previewTimer;
    imageUrlInput.addEventListener('input', () => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updateUrlPreview, 300);
    });

    function previewSelectedFile(file) {
      clearObjectUrl();
      objectUrl = URL.createObjectURL(file);
      fileNameEl.textContent = `${file.name}（${(file.size / 1024).toFixed(0)} KB）`;
      showPreviewFromSrc(objectUrl, true);
    }

    function handleFile(file) {
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        setStatus('❌ 請選擇圖片檔案', 'error');
        return;
      }

      if (file.size > MAX_UPLOAD_BYTES) {
        setStatus('❌ 圖片過大，請壓縮至 5 MB 以內', 'error');
        return;
      }

      selectedFile = file;
      setStatus('', '');
      previewSelectedFile(file);
    }

    imageFileInput.addEventListener('change', () => {
      const file = imageFileInput.files && imageFileInput.files[0];
      handleFile(file);
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      imageFileInput.files = e.dataTransfer.files;
      handleFile(file);
    });

    function isSocialPlatform(link) {
      if (!link) return false;
      try {
        const host = new URL(link).hostname.toLowerCase();
        return SOCIAL_HOSTS.some(
          (domain) => host === domain || host.endsWith('.' + domain)
        );
      } catch {
        return SOCIAL_HOSTS.some((domain) =>
          String(link).toLowerCase().includes(domain)
        );
      }
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type || '';
    }

    function createMatchCard(match, matchType) {
      const title =
        match.title || match.source || match.link || '未命名來源';
      const link = match.link || match.source_url || match.url || '';
      const source = match.source || '';
      const thumb =
        match.thumbnail || match.image || match.thumbnail_url || '';

      const card = document.createElement('article');
      card.className = 'result-card';

      if (thumb) {
        const img = document.createElement('img');
        img.className = 'result-thumb';
        img.src = thumb;
        img.alt = '';
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        card.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'result-body';

      const header = document.createElement('div');
      header.className = 'result-header';

      const titleEl = document.createElement('div');
      titleEl.className = 'result-title';
      titleEl.textContent = title;
      header.appendChild(titleEl);

      const badges = document.createElement('div');
      badges.className = 'result-badges';

      const typeBadge = document.createElement('span');
      typeBadge.className =
        'badge ' + (matchType === 'exact' ? 'badge-exact' : 'badge-visual');
      typeBadge.textContent =
        matchType === 'exact' ? 'Exact Match' : 'Visual Match';
      badges.appendChild(typeBadge);

      if (isSocialPlatform(link) || isSocialPlatform(source)) {
        const socialBadge = document.createElement('span');
        socialBadge.className = 'badge badge-social';
        socialBadge.textContent = 'Social Platform';
        badges.appendChild(socialBadge);
      }

      header.appendChild(badges);
      body.appendChild(header);

      if (link) {
        const a = document.createElement('a');
        a.className = 'result-link';
        a.href = link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = link;
        body.appendChild(a);
      }

      if (source && source !== title) {
        const meta = document.createElement('div');
        meta.className = 'result-meta';
        meta.textContent = source;
        body.appendChild(meta);
      }

      card.appendChild(body);
      return card;
    }

    function renderSection(title, matches, matchType, fragment) {
      if (!matches.length) return;

      const heading = document.createElement('h2');
      heading.className = 'section-title';
      heading.textContent = title;
      fragment.appendChild(heading);

      matches.forEach((match) => {
        fragment.appendChild(createMatchCard(match, matchType));
      });
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';

      const exact = Array.isArray(data.exact_matches) ? data.exact_matches : [];
      let visual = Array.isArray(data.visual_matches) ? data.visual_matches : [];

      // 舊 Worker 可能只有 visual_matches / matches
      if (!exact.length && !visual.length && Array.isArray(data.matches)) {
        visual = data.matches;
      }

      if (!exact.length && !visual.length) {
        resultsEl.innerHTML =
          '<p class="empty-state">找不到相符結果。可試另一張更清晰、裁切較少的圖。</p>';
        return;
      }

      // 去掉 visual 裡與 exact 重複的連結，避免清單雜訊
      const exactLinks = new Set(
        exact.map((m) => (m.link || m.url || '').toLowerCase()).filter(Boolean)
      );
      visual = visual.filter((m) => {
        const link = (m.link || m.url || '').toLowerCase();
        return !link || !exactLinks.has(link);
      });

      const fragment = document.createDocumentFragment();
      renderSection(`完全相符（${exact.length}）`, exact, 'exact', fragment);
      renderSection(`視覺相似（${visual.length}）`, visual, 'visual', fragment);
      resultsEl.appendChild(fragment);

      return { exactCount: exact.length, visualCount: visual.length };
    }

    function extractImgBBUrl(data) {
      const candidates = [
        data && data.data && data.data.url,
        data && data.data && data.data.display_url,
        data && data.url,
        data && data.imageUrl,
      ];
      return (
        candidates.find((v) => typeof v === 'string' && /^https?:\/\//i.test(v)) ||
        ''
      );
    }

    // 從 Worker 取得 ImgBB key（Passcode 保護；Key 不寫在前端原始碼）
    async function fetchImgBBConfig(passcode) {
      const response = await fetch(`${WORKER_URL}?action=imgbb-config`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Passcode': passcode,
        },
        body: '{}',
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.key) {
        throw new Error(data.error || '無法取得 ImgBB 設定');
      }
      return {
        key: data.key,
        expiration: Number(data.expiration) || IMGBB_EXPIRATION_SEC,
        uploadUrl: data.upload_url || 'https://api.imgbb.com/1/upload',
      };
    }

    // 優先：瀏覽器直連 ImgBB（用使用者 IP，避開 Worker IP 被回 maintenance）
    async function uploadImgBBFromBrowser(file, passcode) {
      const config = await fetchImgBBConfig(passcode);
      const formData = new FormData();
      formData.append('image', file, file.name || 'upload.jpg');
      formData.append('name', file.name || 'upload');

      const endpoint =
        `${config.uploadUrl}?key=${encodeURIComponent(config.key)}` +
        `&expiration=${config.expiration}`;

      const response = await fetch(endpoint, {
        method: 'POST',
        body: formData,
      });
      const data = await response.json().catch(() => ({}));
      const url = extractImgBBUrl(data);

      if (!response.ok || !data.success || !url) {
        const msg =
          (data && data.error && data.error.message) ||
          'ImgBB 瀏覽器上傳失敗';
        throw new Error(msg);
      }
      return url;
    }

    // 備援：Worker 代轉（base64）
    async function uploadImgBBViaWorker(file, passcode) {
      const formData = new FormData();
      formData.append('image', file, file.name || 'upload.jpg');
      formData.append('expiration', String(IMGBB_EXPIRATION_SEC));

      const response = await fetch(`${WORKER_URL}?action=imgbb`, {
        method: 'POST',
        headers: {
          'X-Access-Passcode': passcode,
        },
        body: formData,
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `ImgBB Worker 上傳失敗（HTTP ${response.status}）`);
      }

      const url = extractImgBBUrl(data);
      if (!url) {
        throw new Error('ImgBB 未回傳有效網址');
      }
      return url;
    }

    // 最後備援：Litterbox 臨時圖床（1 小時，瀏覽器 CORS 可用）
    async function uploadToLitterbox(file) {
      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      formData.append('time', '1h');
      formData.append('fileToUpload', file, file.name || 'upload.jpg');

      const response = await fetch(
        'https://litterbox.catbox.moe/resources/internals/api.php',
        { method: 'POST', body: formData }
      );
      const text = (await response.text()).trim();
      if (!response.ok || !/^https?:\/\//i.test(text)) {
        throw new Error(text || 'Litterbox 上傳失敗');
      }
      return text;
    }

    async function uploadToImgBB(file, passcode) {
      try {
        return await uploadImgBBFromBrowser(file, passcode);
      } catch (browserErr) {
        console.warn('ImgBB browser upload failed:', browserErr);
        try {
          return await uploadImgBBViaWorker(file, passcode);
        } catch (workerErr) {
          console.warn('ImgBB worker upload failed:', workerErr);
          try {
            return await uploadToLitterbox(file);
          } catch (litterErr) {
            throw new Error(
              (browserErr && browserErr.message) ||
                (workerErr && workerErr.message) ||
                (litterErr && litterErr.message) ||
                '圖片上傳失敗'
            );
          }
        }
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const passcode = passcodeInput.value.trim();

      if (!passcode) {
        setStatus('❌ 請輸入通行密碼', 'error');
        return;
      }

      let imageUrl = '';

      if (sourceMode === 'url') {
        imageUrl = imageUrlInput.value.trim();
        if (!isValidImageUrl(imageUrl)) {
          setStatus('❌ 請輸入有效的圖片網址', 'error');
          return;
        }
      } else if (!selectedFile) {
        setStatus('❌ 請先上傳圖片', 'error');
        return;
      }

      localStorage.setItem(PASSCODE_KEY, passcode);
      resultsEl.innerHTML = '';
      submitBtn.disabled = true;

      try {
        if (sourceMode === 'upload') {
          setStatus('☁️ 上傳圖片至 ImgBB（5 分鐘後自動刪除）...', 'loading');
          imageUrl = await uploadToImgBB(selectedFile, passcode);
        }

        const payload = { imageUrl, image_url: imageUrl };
        setStatus('🔍 分析搜尋中，請稍候...', 'loading');

        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Passcode': passcode,
          },
          body: JSON.stringify(payload),
        });

        if (response.status === 401) {
          setStatus('❌ 密碼錯誤，拒絕存取', 'error');
          return;
        }

        if (!response.ok) {
          let detail = '';
          try {
            const errBody = await response.json();
            detail = errBody.error ? `：${errBody.error}` : '';
          } catch (_) {
            /* ignore */
          }
          setStatus(
            `❌ 請求失敗（HTTP ${response.status}）${detail}`,
            'error'
          );
          return;
        }

        const data = await response.json();
        if (data.error && !data.exact_matches && !data.visual_matches) {
          setStatus(`❌ ${data.error}`, 'error');
          return;
        }

        const counts = renderResults(data) || {
          exactCount: 0,
          visualCount: 0,
        };
        setStatus(
          `✅ Exact ${counts.exactCount}／Visual ${counts.visualCount}`,
          'success'
        );
      } catch (err) {
        console.error(err);
        setStatus(
          `❌ ${err && err.message ? err.message : '連線失敗，請檢查網路或服務是否正常'}`,
          'error'
        );
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
